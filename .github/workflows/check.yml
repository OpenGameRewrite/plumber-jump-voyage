name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: python tools/asset_contract.py
      - run: python tools/annotate-assets.py --self-check
      - run: python tools/convert-outfits.py --self-check
      - run: python tools/check-repository.py
      - run: python tools/extract.py --self-check
      - run: python tools/pack-glb.py --self-check
      - run: python tools/extract-sounds.py --self-check
      - run: python tools/compare-traces.py --self-check
      - run: cargo fmt --check
      - run: cargo check --locked -j 2
      - run: cargo clippy --all-features --locked -j 2 -- -D warnings
      - run: cargo test --locked -j 2 --all-features
      - run: cargo run --locked -j 2 --all-features -- --self-check
